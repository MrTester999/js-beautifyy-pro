<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body,#editor{height:100%;margin:0;background:#080d15}#source{display:none}
</style></head><body>
<textarea id="source">// JavaScript intelligence preview
const API_BASE = "https://api.example.com/v2";

async function loadProfile(userId) {
  const response = await fetch(`${API_BASE}/users/${userId}?include=roles`, {
    headers: { Authorization: "Bearer demo_token" }
  });
  if (!response.ok) throw new Error(`Request failed: ${response.status}`);
  return response.json();
}

const profile = await loadProfile(42);
console.log("Profile loaded", profile?.name ?? "anonymous");</textarea>
<div id="editor"></div>
<script type="module">import {createCodeEditor} from "../vendor/editor.bundle.js";createCodeEditor({textarea:document.querySelector("#source"),parent:document.querySelector("#editor")});</script>
</body></html>
